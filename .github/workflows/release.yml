name: Release

# Push a tag like `v0.5.0` to test the extension, attach the VSIX to a GitHub
# Release, and publish it to both registries in one job, so the VS Code
# Marketplace and Open VSX can never serve different builds.
#
# Marketplace: set the repository variable VSCE_TRUSTED_PUBLISHING=true once the
# publisher trusts this workflow, or provide the VSCE_PAT secret.
# Open VSX: provide the OVSX_PAT secret.
# A registry with no credentials is skipped with a warning; the GitHub Release always happens.
#
# Run it again for an existing tag (after adding a credential, say) from Actions > Release > Run workflow.
# Releases are edited in place and a version a registry already has is skipped, so a re-run is safe.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.5.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Test and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Package
        run: pnpm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: dist
      - name: Check the tag matches the manifest
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          manifest=$(node -p "require('./apps/vscode/package.json').version")
          [ "$version" = "$manifest" ] || { echo "tag $version, manifest $manifest"; exit 1; }
          test -f "dist/ditfa-code-$version.vsix"
      - name: Write the release notes
        run: |
          version="${TAG#v}"
          (cd dist && sha256sum "ditfa-code-$version.vsix" > "ditfa-code-$version.vsix.sha256")
          {
            printf '## Install\n\n'
            printf 'Download `ditfa-code-%s.vsix` below, then run:\n\n' "$version"
            printf '```bash\ncode --install-extension ditfa-code-%s.vsix\n```\n\n' "$version"
            printf 'In Cursor, Windsurf, or VSCodium, use **Extensions: Install from VSIX**.\n'
            printf 'Open **Ditfa Code** in the activity bar and it sets up the rest.\n\n'
            awk -v heading="## [$version]" \
              'index($0, "## [") == 1 { if (found) exit; found = index($0, heading) == 1; next } found' \
              apps/vscode/CHANGELOG.md
          } > dist/notes.md
          grep -q '^### ' dist/notes.md || { echo "CHANGELOG has no entry for $version"; exit 1; }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          files=("dist/ditfa-code-$version.vsix" "dist/ditfa-code-$version.vsix.sha256")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/notes.md
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ditfa Code $version" \
              --notes-file dist/notes.md \
              --verify-tag
          fi
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TRUSTED: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            npx --yes @vscode/vsce@3.6.0 publish --skip-duplicate --packagePath "dist/ditfa-code-${TAG#v}.vsix" --oidc
          elif [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce@3.6.0 publish --skip-duplicate --packagePath "dist/ditfa-code-${TAG#v}.vsix"
          else
            echo "::warning::No Marketplace credentials (VSCE_PAT or VSCE_TRUSTED_PUBLISHING); skipped."
          fi
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish "dist/ditfa-code-${TAG#v}.vsix" --skip-duplicate -p "$OVSX_PAT"
          else
            echo "::warning::No Open VSX token (OVSX_PAT); skipped."
          fi
